server {
    listen 80;
    server_name panel-crazyfr.ru www.panel-crazyfr.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name panel-crazyfr.ru www.panel-crazyfr.ru;

    ssl_certificate     /etc/letsencrypt/live/panel-crazyfr.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel-crazyfr.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend (React admin panel)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Telegram Webhook — POST only
    location /webhook/telegram {
        proxy_pass http://backend:8000/webhook/telegram;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        limit_except POST { deny all; }
    }

    # Health check
    location /health {
        proxy_pass http://backend:8000/health;
    }
}
